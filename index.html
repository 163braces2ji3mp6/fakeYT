    <title>Leaf Hub</title>
    <script>
      // GitHub Pages SPA fallback：把 404.html 暫存到 query 的路徑還原成正常前端路由。
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function(s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?');

          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
